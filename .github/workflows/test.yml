name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflow export is up to date with the generator
        run: |
          python3 scripts/build_workflow.py
          git diff --exit-code workflow/ || (echo "Run scripts/build_workflow.py and commit the result" && exit 1)
      - name: Code-node tests
        run: node tests/simulate_code_nodes.js
